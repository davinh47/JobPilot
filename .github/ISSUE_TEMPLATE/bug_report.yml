name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach real resumes, API keys, pairing tokens, or personal application data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: ai-provider
    attributes:
      label: AI mode
      options:
        - AI disabled
        - OpenAI
        - DeepSeek
        - Not applicable
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: e.g. main at abc1234
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. macOS 15, Node 22, Chrome 138
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove personal data, file paths, keys, and tokens before pasting logs.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real resumes, API keys, tokens, and personal application data.
          required: true

